<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<script>
  (() => {
    const path = location.pathname.replace(/\/+$/, '') || '/';
    document.documentElement.classList.add(path === '/' ? 'site-home' : 'site-inner');
    if (path === '/portfolio') document.documentElement.classList.add('page-portfolio');
  })();
</script>
<meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description | default .Site.Title }}{{ else if .Description }}{{ .Description | plainify }}{{ else }}{{ .Summary | plainify }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Bebas+Neue&family=Bree+Serif&family=Nunito:wght@400;600;700;800;900;1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ printf "%s?v=20" ("css/main.css" | relURL) }}">
<link rel="icon" href="{{ .Site.Params.favicon | default "favicon.svg" | relURL }}" type="image/svg+xml">
{{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .RelPermalink }}">{{ end }}
<meta name="twitter:card" content="summary">
<meta property="og:locale" content="{{ .Site.Language.Lang | default .Site.LanguageCode }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .IsHome }}{{ .Site.Params.description | default .Site.Title }}{{ else if .Description }}{{ .Description | plainify }}{{ else }}{{ .Summary | plainify }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
